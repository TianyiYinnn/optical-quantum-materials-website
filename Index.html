    :root{--ink:#142b46;--teal:#177b80;--muted:#56697c;--line:#d9e3e9;--wash:#edf3f7;--violet:#8177b5;--paper:#fcfdfe;--white:#fff}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 Arial,"Noto Sans TC",sans-serif}
    a{color:inherit;text-decoration:none}
    a:hover{color:var(--teal)}
    button,input,select{font:inherit}
    button,a,input,select{-webkit-tap-highlight-color:transparent}
    button{cursor:pointer}
    a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:5px}
    .skip{position:absolute;left:20px;top:-80px;background:var(--white);padding:12px;z-index:9}
    .skip:focus{top:10px}
    .wrap{max-width:1280px;margin:auto;padding:0 48px}
    header{border-bottom:1px solid var(--line);background:var(--paper)}
    .header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:28px;padding-top:22px}
    .brand{display:flex;gap:14px;align-items:center;min-width:0;width:max-content;max-width:100%}
    .brand-mark{width:34px;height:34px;flex:0 0 34px;position:relative;border:1px solid var(--line);border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--paper) 0 17%,transparent 18%),linear-gradient(135deg,transparent 46%,var(--teal) 47% 52%,transparent 53%)}
    .brand-mark:after{content:"";position:absolute;inset:7px;border:1px solid var(--violet);border-radius:50%;transform:scaleY(.45) rotate(-18deg)}
    .brand span{font-size:12px;line-height:1.35;max-width:440px;font-weight:600;letter-spacing:.02em}
    .brand small{display:block;color:var(--muted);font-size:11px;margin-top:5px;font-weight:400;letter-spacing:0}
    .menu{display:none;border:1px solid var(--line);background:transparent;border-radius:3px;padding:8px 12px}
    nav{grid-column:1/-1;display:flex;align-items:center;gap:24px;border-top:1px solid var(--line);margin-top:20px;min-height:58px}
    nav a{font-size:13px;white-space:nowrap;padding:18px 0}
    nav a[aria-current=page]{box-shadow:0 2px var(--teal);color:var(--teal)}
    .lang{margin-left:auto;border:1px solid var(--line);background:transparent;border-radius:3px;padding:8px 12px;white-space:nowrap}
    main{min-height:65vh}
    main:focus{outline:none}
    .hero{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:center;padding-top:64px;padding-bottom:70px}
    .eyebrow{font-size:14px;color:var(--teal);margin:0 0 20px;display:flex;align-items:center;gap:10px}
    .eyebrow:before{content:"";width:25px;height:2px;background:var(--teal)}
    h1{font-size:clamp(40px,4.7vw,66px);font-weight:500;line-height:1.15;letter-spacing:-2px;margin:0 0 28px}
    html[lang=zh-Hant] h1{letter-spacing:-1px;line-height:1.4}
    h2{font-size:32px;font-weight:500;line-height:1.3;letter-spacing:-.7px;margin:0 0 12px}
    h3{font-size:22px;font-weight:500;line-height:1.4;margin:0 0 13px}
    .lead{color:var(--muted);font-size:18px;max-width:700px;margin:0 0 28px}
    .hero .lead{max-width:510px}
    .actions{display:flex;gap:25px;align-items:center;flex-wrap:wrap}
    .button{display:inline-block;background:var(--ink);color:var(--white);border:1px solid var(--ink);padding:12px 21px;border-radius:3px;font-size:14px}
    .button:hover{background:var(--teal);color:var(--white)}
    .textlink{border-bottom:1px solid var(--teal);font-size:14px;padding:8px 0}
    .art{margin:0;position:relative}
    .art svg{width:100%;height:auto;display:block}
    .art figcaption{font-size:11px;color:var(--muted);text-align:right}
    .section{padding:68px 0;border-top:1px solid var(--line)}
    .sectionhead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:34px}
    .sectionhead p{margin:0;color:var(--muted);max-width:700px}
    .small,.meta{font-size:13px;color:var(--muted)}
    .directions{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
    .direction{border-top:2px solid var(--teal);padding-top:22px}
    .direction-id{font-size:13px;color:var(--teal);margin-bottom:22px;display:block}
    .direction h3{font-size:19px}
    .direction p{font-size:14px;color:var(--muted)}
    .expertise-grid{display:flex;flex-wrap:wrap;gap:10px 28px;border-top:1px solid var(--line);padding-top:22px}
    .expertise-grid span{min-width:210px;padding:12px 0;border-bottom:1px solid var(--line)}
    .home-ledger{display:grid;grid-template-columns:1fr 1fr;gap:60px}
    .home-ledger p{color:var(--muted);max-width:590px}
    .band{margin:0 -48px;padding:62px 48px;background:var(--wash)}
    .pagehead{padding:60px 0 38px;border-bottom:1px solid var(--line)}
    .pagehead h1{font-size:50px;margin-bottom:18px}
    .pagehead .lead{max-width:850px}
    .research-overview{display:grid;grid-template-columns:1fr 1fr;gap:70px;padding:52px 0}
    .research-overview p{margin-top:0;color:var(--muted)}
    .research-ledger{border-top:1px solid var(--ink);margin-bottom:64px}
    .research-field{display:grid;grid-template-columns:90px minmax(260px,.85fr) minmax(360px,1.6fr);gap:38px;padding:42px 0;border-bottom:1px solid var(--line)}
    .research-field .field-id{font-size:13px;color:var(--teal);font-weight:600}
    .research-field h2{font-size:27px}
    .research-field p{margin:0;color:var(--muted)}
    .theme-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
    .theme-list span{border:1px solid #c7d4dc;padding:5px 9px;font-size:12px;color:var(--ink)}
    .framework{display:grid;grid-template-columns:1fr 2fr;gap:70px;padding:0 0 68px}
    .framework p{margin-top:0;color:var(--muted)}
    .research-narrative{position:relative}
    .research-narrative h2{max-width:430px}
    .editorial-note{max-width:860px;margin:0 0 68px;padding:20px 24px;border-left:3px solid var(--teal);background:var(--wash);color:var(--muted)}
    .member-summary{display:grid;grid-template-columns:1.25fr repeat(3,.55fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin:42px 0 34px}
    .member-summary>div{padding:22px 20px;border-right:1px solid var(--line)}
    .member-summary>div:first-child{padding-left:0}
    .member-summary>div:last-child{border-right:0}
    .member-summary strong{display:block;font-size:24px;font-weight:500}
    .member-summary span{font-size:12px;color:var(--muted)}
    .toolbar{display:flex;gap:18px;padding:22px;background:var(--wash);margin-bottom:25px;align-items:end;flex-wrap:wrap}
    .toolbar label{font-size:12px;display:flex;flex-direction:column;gap:7px;min-width:170px}
    .toolbar label:first-child{flex:1;min-width:250px}
    input,select{border:1px solid #adbeca;border-radius:3px;background:var(--white);padding:10px 12px;color:var(--ink);min-height:46px;max-width:100%}
    .reset{background:none;border:0;padding:12px;color:var(--teal);text-decoration:underline}
    .count{font-size:13px;color:var(--muted);margin-bottom:22px}
    .results{padding-bottom:68px}
    .member-page-nav{display:flex;gap:10px;flex-wrap:wrap;padding:22px 0;margin:0;min-height:0;border:0;border-bottom:1px solid var(--line)}
    .member-page-nav a{padding:9px 14px;border:1px solid var(--line);font-size:13px;background:var(--white)}
    .member-page-nav a:hover{border-color:var(--teal);color:var(--teal)}
    .members{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .member{position:relative;border:1px solid var(--line);border-top:2px solid var(--teal);padding:24px;min-height:276px;display:flex;flex-direction:column;background:var(--white)}
    .member h2{margin:7px 0 3px;font-size:23px}
    .member .enname{font-size:13px;color:var(--muted)}
    .member .discipline{font-size:13px;margin:8px 0;color:var(--muted)}
    .member-role{font-size:12px;color:var(--teal)}
    .member-description{font-size:14px;color:var(--muted);margin:14px 0 20px;max-width:38ch}
    .member .contact-links{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--teal);margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
    .people-section{padding:54px 0;border-bottom:1px solid var(--line)}
    .people-section:last-child{border-bottom:0}
    .people-heading{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:28px}
    .people-heading p{max-width:650px;margin:0;color:var(--muted)}
    .director-profile{display:grid;grid-template-columns:minmax(250px,.75fr) minmax(0,1.5fr);gap:64px;padding:38px 0 42px;border-top:2px solid var(--teal);border-bottom:1px solid var(--line)}
    .director-profile h2{font-size:34px}
    .director-profile .role{font-size:14px;color:var(--teal);margin-bottom:6px}
    .director-profile .contact-links{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--teal);margin-top:20px}
    .director-profile .member-description{font-size:17px;line-height:1.75;max-width:68ch;margin-top:0;color:var(--ink)}
    .research-label{font-size:12px;color:var(--muted);margin:22px 0 9px}
    .research-tags{display:flex;gap:8px;flex-wrap:wrap}
    .research-tag{border:1px solid #b8cbd2;padding:6px 10px;font-size:12px;color:var(--ink);background:var(--paper)}
    .staff-placeholder{padding:30px 34px;border:1px solid var(--line);background:var(--wash);color:var(--muted)}
    .staff-placeholder h3{color:var(--ink)}
    .empty{padding:45px;border:1px solid var(--line);text-align:center;color:var(--muted)}
    .publication-record{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.8fr);gap:45px;padding:34px 0;border-bottom:1px solid var(--line)}
    .publication-record h2{font-size:23px;letter-spacing:-.3px;margin-bottom:14px}
    .publication-record .authors{font-size:14px;color:var(--muted);margin:0}
    .pub-meta{display:grid;grid-template-columns:88px 1fr;align-content:start;font-size:13px}
    .pub-meta dt,.pub-meta dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line)}
    .pub-meta dt{color:var(--muted)}
    .pub-meta dd{overflow-wrap:anywhere}
    .pub-meta a{color:var(--teal);text-decoration:underline}
    .content-grid{display:grid;grid-template-columns:1fr 2fr;gap:80px;padding:55px 0;border-bottom:1px solid var(--line)}
    .content-grid p{margin-top:0;color:var(--muted)}
    .mechanisms{display:grid;grid-template-columns:repeat(2,1fr);gap:0 42px;margin-top:28px}
    .mechanism{padding:22px 0;border-top:1px solid var(--line)}
    .mechanism h3{font-size:19px}
    .facility-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 46px;margin:40px 0 28px;border-top:1px solid var(--ink)}
    .facility-area{padding:30px 0;border-bottom:1px solid var(--line)}
    .facility-area h2{font-size:23px}
    .facility-area p{color:var(--muted);max-width:58ch}
    .facility-note{margin:0 0 70px;padding:22px 26px;border-left:3px solid var(--teal);background:var(--wash);color:var(--muted)}
    .placeholder{max-width:760px;margin:58px 0 80px;padding:34px;border-left:3px solid var(--teal);background:var(--wash)}
    footer{background:var(--ink);color:var(--white);padding:38px 0}
    .footer{display:flex;justify-content:space-between;gap:30px}
    .footer p{font-size:12px;color:#c4d0dc;margin:8px 0;max-width:520px}
    .footer nav{display:block;border:0;margin:0;min-height:auto}
    .footer a{font-size:13px}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    @media(max-width:1080px){
      .wrap{padding:0 28px}.band{margin:0 -28px;padding-left:28px;padding-right:28px}.header{display:flex;flex-wrap:wrap;padding:18px 0}.brand{flex:1}.menu{display:block}nav{display:none;width:100%;flex-wrap:wrap;padding:8px 0 0;margin-top:8px;gap:20px;border-top:1px solid var(--line)}nav.open{display:flex}.lang{margin-left:0}.directions{grid-template-columns:repeat(2,1fr)}.members{grid-template-columns:repeat(2,1fr)}.research-field{grid-template-columns:70px 1fr}.research-field>div:last-child{grid-column:2}.publication-record{grid-template-columns:1fr}.pub-meta{max-width:520px}
    }
    @media(max-width:720px){
      .wrap{padding:0 22px}.band{margin:0 -22px;padding-left:22px;padding-right:22px}.brand span{font-size:11px;max-width:290px}.brand small{font-size:10px}.hero{grid-template-columns:1fr;padding:42px 0 52px;gap:20px}.hero h1{font-size:45px}.hero .lead{font-size:16px}.art{max-width:530px;margin:auto;width:100%}.art svg{max-height:380px}.section{padding:48px 0}.sectionhead{align-items:start;flex-direction:column;gap:10px}.pagehead{padding-top:40px}.pagehead h1{font-size:39px}.pagehead .lead{font-size:16px}.research-overview,.home-ledger,.framework,.content-grid,.director-profile{grid-template-columns:1fr;gap:20px}.research-field{grid-template-columns:1fr;gap:12px;padding:32px 0}.research-field>div:last-child{grid-column:auto}.member-summary{grid-template-columns:1fr 1fr}.member-summary>div{border-bottom:1px solid var(--line)}.member-summary>div:first-child{grid-column:1/-1;padding-left:20px}.members{gap:0 22px}.mechanisms,.facility-grid{grid-template-columns:1fr}.people-heading{align-items:start;flex-direction:column;gap:10px}.footer{flex-direction:column;gap:15px}.toolbar{padding:16px;gap:12px}.toolbar label{flex:1;min-width:135px}.toolbar label:first-child{min-width:100%}
    }
    @media(max-width:440px){
      .brand span{max-width:235px}.brand-mark{width:28px;height:28px;flex-basis:28px}.members,.directions{grid-template-columns:1fr}.hero h1{font-size:40px}.member{min-height:230px}.publication-record h2{font-size:20px}.pub-meta{grid-template-columns:72px 1fr}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>

class="people-heading"><h2 id="staff-title">${t('staff')}</h2></div><div class="staff-placeholder"><h3>${t('staff')}</h3><p>${t('staffEmpty')}</p></div></section>`}
    function publicationsPage(){return intro(t('publications'),t('publicationsIntro'))+`<section class="section">${DATA.papers.map(publicationRecord).join('')}</section>`}
    function facilitiesPage(){const areas=[['facilityGrowth','facilityGrowthBody'],['facilityCharacterisation','facilityCharacterisationBody'],['facilityFabrication','facilityFabricationBody'],['facilityTransport','facilityTransportBody']];return intro(t('facilities'),t('facilitiesIntro'))+`<section class="facility-grid">${areas.map(([heading,body])=>`<article class="facility-area"><h2>${t(heading)}</h2><p>${t(body)}</p></article>`).join('')}</section><div class="facility-note">${t('facilityNotice')}</div>`}
    function newsPage(){return intro(t('news'),t('newsIntro'))+`<div class="placeholder"><h2>${t('news')}</h2><p>${t('newsEmpty')}</p></div>`}
    function collaborationPage(){const items=[['joint','jointBody'],['exchange','exchangeBody'],['industry','industryBody'],['translation','translationBody']];return intro(t('collaboration'),t('collabIntro'))+`<section class="section"><div class="mechanisms">${items.map(([h,b])=>`<article class="mechanism"><h3>${t(h)}</h3><p>${t(b)}</p></article>`).join('')}</div></section>`}
    function contactPage(){return intro(t('contact'),t('contactIntro'))+`<div class="placeholder"><h2>${t('contact')}</h2><p>${t('contactBody')}</p>${link('members',t('browseMembers'),'textlink')}</div>`}
    function missing(){return intro(t('notfound'),'')+link('home',t('returnHome'),'button')}
    function render(scroll=true){const raw=location.hash.slice(1)||'/zh/home',parts=raw.split('?'),segments=parts[0].split('/').filter(Boolean);lang=segments[0]==='en'?'en':'zh';page=segments[1]||'home';params=new URLSearchParams(parts[1]||'');document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.title=(T[lang][page]||t('home'))+' | '+t('brand');$('#header').innerHTML=`<a class="brand" href="${url('home')}"><span class="brand-mark" aria-hidden="true"></span><span>${t('brand')}<small>${t('host')}</small></span></a><button class="menu" aria-controls="nav" aria-expanded="false">${t('menu')}</button><nav id="nav" aria-label="${t('menu')}">${NAV.map(p=>`<a href="${url(p)}" ${p===page?'aria-current="page"':''}>${t(p)}</a>`).join('')}<button class="lang" aria-label="${lang==='zh'?'Switch to English':'切換至繁體中文'}">${lang==='zh'?'English':'繁體中文'}</button></nav>`;$('.menu').onclick=()=>{const open=$('#nav').classList.toggle('open');$('.menu').setAttribute('aria-expanded',String(open))};$('.lang').onclick=()=>{const y=scrollY;location.hash='#/'+(lang==='zh'?'en':'zh')+'/'+page+(params.size?'?'+params:'');requestAnimationFrame(()=>window.scrollTo(0,y))};const pages={home,about:aboutPage,research:researchPage,members:membersPage,publications:publicationsPage,facilities:facilitiesPage,collaboration:collaborationPage,news:newsPage,contact:contactPage};$('#main').innerHTML=(pages[page]||missing)();$('#footer').innerHTML=`<div><strong>${t('brand')}</strong><p>${t('host')}</p><p>${t('footer')}</p></div><div>${link('contact',t('contact'),'textlink')}</div>`;if(page==='members')bindMemberFilters();if(scroll){window.scrollTo(0,0);$('#main').focus({preventScroll:true})}}
    $('.skip').onclick=e=>{e.preventDefault();$('#main').focus();$('#main').scrollIntoView()};
    window.addEventListener('hashchange',()=>render());
    render(false);
  </script>
</body>
</html>
